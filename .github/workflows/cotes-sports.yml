name: Cotes Winamax et Safe du jour
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_football_markets.py'
      - 'football-markets.js'
      - 'market-audit.js'
      - 'tests/football-markets*'
      - 'tests/test_football_markets.py'
      - 'scripts/update_sports.py'
      - 'scripts/update_odds.py'
      - 'scripts/update_scores.py'
      - 'bet-results.js'
      - 'tests/bet-results*'
      - 'tests/test_scores.py'
      - 'scripts/check_quotes.py'
      - 'scripts/collect_quotes.py'
      - 'feed-health.js'
      - 'tests/test_collection_health.py'
      - 'tests/feed-health-browser.cjs'
      - 'uefa.js'
      - '.github/workflows/cotes-sports.yml'
      - 'safe*'
      - 'paper*'
      - 'scripts/paper_tests.cjs'
      - 'scripts/paper_multi_tests.cjs'
      - 'sport-catalog.js'
      - 'notifications*'
      - 'alerts-engine.cjs'
      - 'scripts/notify.cjs'
      - 'ticket-reference.js'
      - 'tests/ticket-reference*'
      - 'index.html'
      - 'sports.html'
      - 'tableau.html'
      - 'tests/safe.test.cjs'
      - 'tests/test_safe_sports.py'
  schedule:
    - cron: '5 6 * * *'
    - cron: '25 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: cotes-sports
  cancel-in-progress: false
jobs:
  actualiser:
    outputs:
      provider_ready: ${{ steps.provider.outputs.ready }}
      collection: ${{ steps.collection.outcome }}
      notifications: ${{ steps.notifications.outcome }}
      scores: ${{ steps.scores.outcome }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la provenance des cotes
        run: |
          python -m unittest discover -s tests -p 'test_sports.py'
          node tests/sports-combos.test.cjs
          node tests/safe.test.cjs
          python -m unittest discover -s tests -p 'test_safe_sports.py'
          python -m unittest discover -s tests -p 'test_uefa.py'
          node tests/uefa.test.cjs
          node tests/paper.test.cjs
          node tests/multisport.test.cjs
          node tests/alerts.test.cjs
          node tests/ticket-reference.test.cjs
          node tests/bet-results.test.cjs
          node tests/football-markets.test.cjs
          python -m unittest discover -s tests -p 'test_football_markets.py'
          python -m unittest discover -s tests -p 'test_scores.py'
          python -m unittest discover -s tests -p 'test_collection_health.py'
      - name: Détecter une modification du collecteur
        id: quote_changes
        if: github.event_name == 'push'
        run: |
          if [ ! -f data/paper-tests-v2.json ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          elif python scripts/check_quotes.py --is-fresh; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- scripts/update_sports.py scripts/update_odds.py scripts/check_quotes.py scripts/collect_quotes.py; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Vérifier l’accès au fournisseur sans exposer la clé
        id: provider
        if: github.event.schedule != '25 23 * * *' && (github.event_name != 'push' || steps.quote_changes.outputs.refresh == 'true')
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_ || secrets.ODDS_API || secrets.ODDS_API_KEY }}
        run: python scripts/check_quotes.py
      - name: Relever les victoires et totaux de buts Winamax
        if: github.event.schedule != '25 23 * * *'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_ || secrets.ODDS_API || secrets.ODDS_API_KEY }}
        run: python scripts/collect_football_markets.py
      - name: Relever les cotes Winamax France
        id: collection
        if: steps.provider.outputs.ready == 'true'
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_ || secrets.ODDS_API || secrets.ODDS_API_KEY }}
        run: python scripts/collect_quotes.py --max-credits 18
      - name: Actualiser les scores de football terminés
        id: scores
        continue-on-error: true
        run: python scripts/update_scores.py --max-requests 8
      - name: Consigner les tests fictifs sans passer d’ordre
        continue-on-error: true
        run: node scripts/paper_multi_tests.cjs
      - name: Notifier les propositions sans passer de pari
        if: github.event.schedule != '25 23 * * *'
        id: notifications
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/notify.cjs
      - name: Publier les relevés
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sports/ data/days/ data/index.json
          if [ -f data/football-market-coverage.json ]; then git add data/football-market-coverage.json; fi
          if [ -f data/quote-budget.json ]; then git add data/quote-budget.json; fi
          if [ -f data/scores-health.json ]; then git add data/scores-health.json; fi
          if [ -f data/collection-health.json ]; then git add data/collection-health.json; fi
          if [ -f data/notification-status.json ]; then git add data/notification-status.json; fi
          if [ -f data/notification-state.json ]; then git add data/notification-state.json; fi
          git add data/paper-tests-v1.json data/paper-status-v1.json data/paper-tests-v2.json data/paper-status-v2.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cotes Winamax multisports et mises fictives"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Préparer le site statique
        run: |
          mkdir -p /tmp/combi-sports-site
          cp market-audit.js football-markets.js bet-results.js feed-health.js ticket-reference.js notifications.html notifications.js index.html tableau.html sports.html uefa.js sport-catalog.js safe-multi-engine.js paper-multi-engine.js paper-engine.js paper-view.js safe.html safe.css safe.js safe-engine.js style.css model.js model-view.js sports.js sports-combos.js manifest.webmanifest .nojekyll /tmp/combi-sports-site/
          cp -r data icons /tmp/combi-sports-site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/combi-sports-site
  publier:
    needs: actualiser
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4

  signaler:
    needs: [actualiser, publier]
    if: always() && needs.publier.result == 'success' && (needs.actualiser.outputs.provider_ready == 'false' || needs.actualiser.outputs.collection == 'failure' || needs.actualiser.outputs.notifications == 'failure' || needs.actualiser.outputs.scores == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Signaler le blocage après publication du diagnostic
        run: |
          echo "::error::La collecte ou l’envoi des alertes est bloqué. Le site a été publié avec le diagnostic dans Collecte et notifications."
          exit 1
