name: Cotes Winamax et Safe du jour
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_sports.py'
      - 'scripts/update_odds.py'
      - 'uefa.js'
      - '.github/workflows/cotes-sports.yml'
      - 'safe*'
      - 'index.html'
      - 'sports.html'
      - 'tableau.html'
      - 'tests/safe.test.cjs'
      - 'tests/test_safe_sports.py'
  schedule:
    - cron: '5 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: cotes-sports
  cancel-in-progress: false
jobs:
  actualiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la provenance des cotes
        run: |
          python -m unittest discover -s tests -p 'test_sports.py'
          node tests/sports-combos.test.cjs
          node tests/safe.test.cjs
          python -m unittest discover -s tests -p 'test_safe_sports.py'
          python -m unittest discover -s tests -p 'test_uefa.py'
          node tests/uefa.test.cjs
      - name: Détecter une modification du collecteur
        id: quote_changes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet HEAD^ HEAD -- scripts/update_sports.py scripts/update_odds.py; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Relever les cotes Winamax France
        if: github.event_name != 'push' || steps.quote_changes.outputs.refresh == 'true'
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_ || secrets.ODDS_API || secrets.ODDS_API_KEY }}
        run: python scripts/update_sports.py --max-credits 18
      - name: Publier les relevés
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sports/ data/days/ data/index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cotes Winamax football basket et tennis"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Préparer le site statique
        run: |
          mkdir -p /tmp/combi-sports-site
          cp index.html tableau.html sports.html uefa.js safe.html safe.css safe.js safe-engine.js style.css model.js model-view.js sports.js sports-combos.js manifest.webmanifest .nojekyll /tmp/combi-sports-site/
          cp -r data icons /tmp/combi-sports-site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/combi-sports-site
  publier:
    needs: actualiser
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4

