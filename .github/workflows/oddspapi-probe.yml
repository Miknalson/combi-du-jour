name: Sonde OddsPapi (temporaire)
on:
  push:
    branches: [claude/project-thread-uhyzom]
    paths: ['scripts/oddspapi_probe.py', '.github/workflows/oddspapi-probe.yml']
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Interroger OddsPapi
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python scripts/oddspapi_probe.py
      - name: Enregistrer les extraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oddspapi-probe
          git commit -m "Sonde OddsPapi football : extraits de réponses" || echo "rien"
          git push
