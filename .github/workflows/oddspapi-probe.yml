name: Essai OddsPapi (temporaire)
on:
  push:
    branches: [claude/project-thread-uhyzom]
    paths: ['scripts/collect_oddspapi.py', '.github/workflows/oddspapi-probe.yml']
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Relever basket et tennis
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python scripts/collect_oddspapi.py
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sports data/oddspapi-budget.json data/oddspapi
          git commit -m "Essai OddsPapi : basket et tennis Winamax" || echo "rien"
          git push
